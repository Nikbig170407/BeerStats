# project.yml
#
# XcodeGen-Spezifikation. Statt ein .xcodeproj manuell zu pflegen (das in
# Git ständig Merge-Konflikte verursacht und ohne Xcode-GUI mühsam zu
# ändern ist), generiert GitHub Actions das komplette Xcode-Projekt bei
# jedem Build automatisch aus dieser Textdatei. Das ist der Grund, warum
# wir ganz ohne lokal installiertes Xcode auskommen: diese Datei UND der
# Swift-Code sind alles, was xcodegen + xcodebuild in der Cloud brauchen.
#
# Doku: https://github.com/yonaskolb/XcodeGen

name: BeerStats

options:
  bundleIdPrefix: com.beerstats
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0

targets:
  BeerStats:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: DesignSystem
      - path: Features
      - path: Models
      - path: Repositories
      - path: Services
      - path: Resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beerstats.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"                    # nur iPhone, kein iPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BeerStats
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signierung passiert bewusst NICHT hier, sondern lokal bei dir durch
        # Sideloadly beim Installieren auf dein iPhone (siehe README.md).
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

  # Testziel für das Regelwerk. Die Engine ist bewusst eine reine Funktion,
  # damit sie ohne Firebase prüfbar ist – bis hierher fehlte nur der Ort,
  # an dem das auch tatsächlich passiert.
  BeerStatsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BeerStats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beerstats.app.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  BeerStats:
    build:
      targets:
        BeerStats: all
        BeerStatsTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - BeerStatsTests
    archive:
      config: Release
