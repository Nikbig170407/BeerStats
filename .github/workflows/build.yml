# .github/workflows/build.yml
#
# Baut BeerStats bei jedem Push auf einem GitHub-gehosteten macOS-Runner.
# Ergebnis ist eine UNSIGNIERTE .ipa-Datei als Download-Artefakt.
# Die eigentliche Signierung für dein Gerät übernimmt anschließend
# Sideloadly auf deinem PC mit deiner Apple-ID (siehe README.md).
#
# Ablauf: checkout → XcodeGen generiert das .xcodeproj → xcodebuild baut
# ohne Code-Signing für echte iPhones (SDK iphoneos) → .app wird in das
# IPA-Format (Payload/App.app als .zip) verpackt → Upload als Artefakt.

name: Build BeerStats (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt manuelles Starten über den "Run workflow"-Button

jobs:
  # Läuft bewusst als EIGENER Job, nicht als Schritt vor dem Bauen: Wenn ein
  # Test rot wird, sollst du trotzdem eine .ipa bekommen. Das Regelwerk ist
  # wichtig, aber eine App, die sich nicht installieren lässt, hilft am Tisch
  # niemandem.
  test:
    runs-on: macos-15

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: xcodegen generate

      - name: Simulator aussuchen
        id: sim
        run: |
          # Nicht auf einen festen Gerätenamen setzen – welche Simulatoren
          # der Runner mitbringt, ändert sich mit jeder Xcode-Version.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device['name'].startswith('iPhone'):
                      print(device['udid']); sys.exit(0)
          sys.exit('kein iPhone-Simulator gefunden')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"

      - name: Regelwerk testen
        run: |
          # Ohne Pipe: Ein "| tail" würde den Rückgabewert von xcodebuild
          # durch den von tail ersetzen – ein fehlgeschlagener Test liefe
          # dann grün durch.
          xcodebuild test \
            -project BeerStats.xcodeproj \
            -scheme BeerStats \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  build:
    runs-on: macos-15

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: xcodegen generate

      - name: Swift-Package-Abhängigkeiten cachen
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: App bauen (ohne Code-Signing, für echtes iPhone)
        run: |
          xcodebuild \
            -project BeerStats.xcodeproj \
            -scheme BeerStats \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: In IPA-Format verpacken
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/BeerStats.app Payload/
          zip -r BeerStats.ipa Payload

      - name: IPA als Download-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BeerStats-ipa
          path: BeerStats.ipa
          retention-days: 14
